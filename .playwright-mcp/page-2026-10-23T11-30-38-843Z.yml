      - generic [ref=e1120]:
        - generic [ref=e1121]:
          - button "01 What are the basic requirements to study in Finland?" [expanded] [ref=e1122] [cursor=pointer]:
            - generic [ref=e1123]: "01"
            - text: What are the basic requirements to study in Finland?
          - paragraph [ref=e1128]: You need a valid passport, strong academic transcripts, proof of English language proficiency, academic references and a compelling motivation letter. Migri sets no language requirement for the residence permit at all — the test is purely an admission matter, and each institution publishes its own list. IELTS Academic, TOEFL iBT, PTE Academic and Cambridge C1 Advanced or C2 Proficiency are accepted across Finnish higher education; the Duolingo English Test is accepted by some institutions and not by others, so check the programme before you book it. Many bachelor programmes also set an entrance examination, and some MBAs ask for a GMAT score or work experience.
        - generic [ref=e1129]:
          - button "02 How does the Finnish residence permit process work?" [ref=e1130] [cursor=pointer]:
            - generic [ref=e1131]: "02"
            - text: How does the Finnish residence permit process work?
          - paragraph [ref=e1134]: "Finland issues a residence permit, not a student visa, and a degree student at a higher education institution gets a continuous A permit for the whole length of the studies. Once you accept your place, you apply on Enter Finland, pay the processing fee, show that you have the funds Migri requires for your living costs, take out private health insurance that meets Migri's coverage rules, and identify yourself in person at a Finnish mission. Ask for the D visa in the same application: it goes into your passport with the decision so you can travel before the permit card arrives. There is no credibility interview and no health surcharge. We guide you through every step."
        - generic [ref=e1135]:
          - button "03 Can I get financial aid or an education loan?" [ref=e1136] [cursor=pointer]:
            - generic [ref=e1137]: "03"
            - text: Can I get financial aid or an education loan?
          - paragraph [ref=e1140]: Yes! We have exclusive tie-ups with top financial institutions and banks to provide both collateral and non-collateral education loans. These loans can cover your tuition fees, accommodation and living expenses at competitive interest rates.
        - generic [ref=e1141]:
          - button "04 Can my family relocate with me to Finland?" [ref=e1142] [cursor=pointer]:
            - generic [ref=e1143]: "04"
            - text: Can my family relocate with me to Finland?
          - paragraph [ref=e1146]: "Yes — and Finland is unusually generous here. Your spouse or registered partner and your children under 18 can be granted a residence permit on the basis of family ties while you are still studying, and that permit carries an unrestricted right to work from day one. The condition is funds rather than eligibility: on top of your own, Migri asks you to show a set monthly amount for each family member who joins you. We build that budget into your plan from the start."
        - generic [ref=e1147]:
          - button "05 How long can I stay and work in Finland after I graduate?" [ref=e1148] [cursor=pointer]:
            - generic [ref=e1149]: "05"
            - text: How long can I stay and work in Finland after I graduate?
          - paragraph [ref=e1152]: "You can apply for a residence permit to look for work or start a business, granted for up to two years, with no sponsorship requirement. You may take it in up to three parts, and you can apply any time within five years of your student permit expiring — so a graduate who goes home first has not lost it. While you study you may already work an average of 30 hours a week. And a degree completed in Finland is its own route to permanent residence: it removes the period-of-residence requirement entirely, once your Finnish or Swedish reaches the required level."
        - generic [ref=e1153]:
          - button "06 Do you help with accommodation and pre-departure?" [ref=e1154] [cursor=pointer]:
            - generic [ref=e1155]: "06"
            - text: Do you help with accommodation and pre-departure?
          - paragraph [ref=e1158]: Yes, we partner with top student housing providers — including HOAS and the other student housing foundations, which have waiting lists you should join the day you accept your place. We also run pre-departure briefings covering Finnish culture, academic expectations, dressing for a Nordic winter, and registering for your personal identity code once you land.
